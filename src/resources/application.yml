server:
  port: 8081

spring:
  application:
    name: ms-compras
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_compras}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configuración de URLs internas para comunicación entre microservicios
services:
  inventario:
    url: ${MS_INVENTARIO_URL:http://localhost:8083}